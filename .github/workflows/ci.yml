name: Offline contract tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LOGURU_LEVEL: ERROR
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-p1.txt
            requirements-v1.txt
      - name: Install isolated dependencies
        shell: pwsh
        run: "& '${{ steps.python.outputs.python-path }}' -m pip install --target .p0_deps -r requirements-v1.txt"
      - name: Fetch pinned upstream
        shell: pwsh
        run: "& '${{ steps.python.outputs.python-path }}' -X utf8 tools/setup_upstream.py"
      - name: Run offline acceptance
        shell: pwsh
        run: "& '${{ steps.python.outputs.python-path }}' -X utf8 -B tools/check_v1.py"
