<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolFlow · 零售 Agent 实验室</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#243c37;background:#f3f5f0;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;border-bottom:1px solid #d9e2d8;display:flex;align-items:center;justify-content:space-between;background:#fff}h1{font-size:22px;margin:0}header span{font-size:12px;color:#60756b}main{max-width:1250px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}section,aside{background:#fff;border:1px solid #dce3da;border-radius:16px;padding:20px}label{display:block;font-size:13px;margin-bottom:6px}select,button,textarea{font:inherit;border-radius:9px;border:1px solid #bdccc1;padding:10px}button{background:#1d6656;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#f1f5ed;color:#2b5145}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{margin:0}.controls select{display:block;margin-top:6px}#messages{height:52vh;min-height:290px;overflow:auto;padding:20px 0}.bubble{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;padding:12px 16px;border-radius:12px;margin:10px 0;background:#f0f5ed}.bubble.user{background:#e3efe9;margin-left:auto}.role{font-size:11px;color:#527668;margin-bottom:4px}.notice{line-height:1.8;color:#617067;font-size:13px}.empty{padding:35px 10px;color:#77847a;line-height:2}textarea{width:100%;resize:vertical;min-height:85px}#send{float:right;margin-top:8px}#confirm{margin:8px 0;display:none}#error{color:#a2392d;white-space:pre-wrap;font-size:13px}#status{line-height:1.9;font-size:13px;overflow-wrap:anywhere}h2{font-size:15px;margin:8px 0 15px}#events{max-height:48vh;overflow:auto;font:12px/1.9 ui-monospace,monospace;overflow-wrap:anywhere}.event{padding:7px 0;border-bottom:1px solid #e9eee5}.tag{background:#edf1e8;border-radius:20px;padding:5px 9px;font-size:12px}a{color:#236751}footer{clear:both;padding-top:15px;font-size:12px;color:#708075}@media(max-width:760px){main{grid-template-columns:1fr;padding:0 10px;margin:12px auto}header{padding:15px}header span{max-width:130px;text-align:right}section,aside{padding:14px}#messages{height:48vh}#events{max-height:260px}.bubble{max-width:98%}}
</style></head><body><header><h1>ToolFlow <span>可靠工具调用 Agent</span></h1><span>本机实验环境 · 模拟业务</span></header><main><section>
<div class="controls"><label>模型接口<select id="backend"><option value="local">本地模型</option></select></label><label>业务环境<select id="mode"><option value="official">官方 Retail · 独立数据库</option><option value="extended">扩展业务 · 注册 / 购买持久保存</option></select></label><button id="new">新建对话</button><button id="close" class="secondary" disabled>结束对话</button></div>
<div id="messages" aria-live="polite"><div class="empty">先新建对话，再输入你的零售请求。<br>换货示例：我想更换已送达订单中的商品。<br>无需输入数据库中的参考答案；客服会根据对话查询信息。</div></div>
<button id="confirm" class="secondary">确认当前操作</button><div id="error" role="alert"></div><textarea id="input" placeholder="输入消息。Enter 换行，Ctrl + Enter 发送。" disabled aria-label="消息内容"></textarea><button id="send" disabled>发送消息</button>
<footer>模型仅能看到对话与工具观测。写操作需明确确认；这些操作只修改模拟数据库，不实际下单或扣款。云端模式可能产生 API 费用。</footer></section><aside><h2>当前执行状态</h2><div id="status">尚未创建会话</div><hr style="border:0;border-top:1px solid #e5eade;margin:20px 0"><h2>工具与校验轨迹</h2><div id="events" class="notice">开始对话后，可在这里观察模型请求、规则拦截、工具执行与回读。</div><p class="notice">运行记录保存在本机 runs/web。刷新页面会恢复当前标签页的会话；服务重启后需新建会话。完整日志可能包含个人信息，请勿公开上传。</p></aside></main>
<script>
const $=id=>document.getElementById(id);let token='',sid=sessionStorage.getItem('toolflow_session')||'',polling=false,lastRender='',last=null;
async function api(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-ToolFlow-Token':token,'X-Session-ID':sid},...(body===undefined?{}:{body:JSON.stringify(body)})});const value=await res.json();if(!res.ok)throw new Error(value.error||'请求失败');return value}
function showError(error){$('error').textContent=error.message||String(error)}
function render(state){last=state;const busy=state.busy;const editable=!busy&&state.status==='waiting_user';$('input').disabled=!editable;$('send').disabled=!editable;$('close').disabled=busy;$('new').disabled=busy;$('backend').disabled=!!sid;$('mode').disabled=!!sid;
$('status').textContent=`运行：${state.run_id}\n模型：${state.backend} / ${state.model}\n环境：${state.retail_mode==='extended'?'扩展业务（账号持久保存）':'官方原始数据库'}\n版本：${state.runtime_revision||'旧版本，请重启服务'}\n状态：${busy?'正在处理，请等待…':state.status}\n模型调用：${state.model_calls} 次\nTokens：${state.total_tokens}\n工具执行：${state.tool_calls} 次\n被拦截提案：${state.blocked_proposals} 次`;$('status').style.whiteSpace='pre-line';
const signature=JSON.stringify(state.messages);if(signature!==lastRender){lastRender=signature;$('messages').replaceChildren();for(const message of state.messages){const bubble=document.createElement('div');bubble.className='bubble '+message.role;const role=document.createElement('div');role.className='role';role.textContent=message.role==='user'?'你':'ToolFlow';bubble.append(role,document.createTextNode(message.content||''));$('messages').append(bubble)}$('messages').scrollTop=$('messages').scrollHeight}
$('events').replaceChildren();for(const event of state.events.slice().reverse()){const row=document.createElement('div');row.className='event';row.textContent=[event.time.slice(11,19),event.event,event.name,event.code,event.source].filter(Boolean).join(' · ');$('events').append(row)}
const latest=state.messages.at(-1);const match=latest?.role==='assistant'&&latest.content?.match(/\/confirm\s+([a-f0-9]{12})/);$('confirm').style.display=editable&&match?'inline-block':'none';$('confirm').dataset.command=match?match[0]:'';if(state.error)$('error').textContent=state.error;}
async function refresh(){if(!sid||polling)return;polling=true;try{render(await api('/api/session'))}catch(error){showError(error);if(error.message.includes('不存在')){sid='';sessionStorage.removeItem('toolflow_session');$('new').disabled=false;$('backend').disabled=false;$('mode').disabled=false}}finally{polling=false}}
async function closeSession(){if(!sid)return;await api('/api/close',{});sid='';sessionStorage.removeItem('toolflow_session');$('backend').disabled=false;$('mode').disabled=false;$('input').disabled=true;$('send').disabled=true;$('close').disabled=true;$('confirm').style.display='none';$('status').textContent='会话已结束，记录已保存'}
$('new').onclick=async()=>{try{$('new').disabled=true;$('error').textContent='';if(sid)await closeSession();const state=await api('/api/session',{backend:$('backend').value,retail_mode:$('mode').value});sid=state.session_id;sessionStorage.setItem('toolflow_session',sid);lastRender='';render(state);$('input').focus()}catch(error){showError(error)}finally{$('new').disabled=false}};
$('close').onclick=async()=>{try{await closeSession()}catch(error){showError(error)}};
async function send(content){if(!content.trim())return;$('send').disabled=true;$('input').disabled=true;$('confirm').style.display='none';$('error').textContent='';try{await api('/api/message',{content,request_id:crypto.randomUUID()});$('input').value='';await refresh()}catch(error){showError(error);await refresh()}}
$('send').onclick=()=>send($('input').value);$('confirm').onclick=()=>send($('confirm').dataset.command);$('input').onkeydown=event=>{if(event.ctrlKey&&event.key==='Enter'&&!$('send').disabled){event.preventDefault();send($('input').value)}};
(async()=>{try{const config=await api('/api/bootstrap');token=config.token;if(config.backends.includes('cloud')){const option=document.createElement('option');option.value='cloud';option.textContent='云端 API（可能收费）';$('backend').append(option)}await refresh();setInterval(refresh,1200)}catch(error){showError(error)}})();
</script></body></html>
